<text x="40" y="54" font-size="27" fill="#68635D" class="number" text-anchor="start" font-weight="400">03</text><text x="40" y="112" font-size="42" fill="#282623" class="title" text-anchor="start" font-weight="600">安装之后，如何同步？</text><text x="40" y="159" font-size="30" fill="#68635D" class="" text-anchor="start" font-weight="400">配置总览 · 详细步骤见正文链接</text><path d="M62,243 L62,317" fill="none" stroke="#D7D0C6" stroke-width="2"/><circle cx="62" cy="217" r="22" fill="#FFFFFF" stroke="#D7D0C6" stroke-width="2"/><text x="62" y="228" font-size="32" fill="#244AC7" class="number" text-anchor="middle" font-weight="400">1</text><text x="105" y="228" font-size="32" fill="#282623" class="" text-anchor="start" font-weight="400">安装插件，打开看板</text><text x="105" y="274" font-size="30" fill="#68635D" class="" text-anchor="start" font-weight="400">登记需要管理的项目</text><path d="M62,365 L62,439" fill="none" stroke="#D7D0C6" stroke-width="2"/><circle cx="62" cy="339" r="22" fill="#FFFFFF" stroke="#D7D0C6" stroke-width="2"/><text x="62" y="350" font-size="32" fill="#244AC7" class="number" text-anchor="middle" font-weight="400">2</text><text x="105" y="350" font-size="32" fill="#282623" class="" text-anchor="start" font-weight="400">批准项目范围</text><text x="105" y="396" font-size="30" fill="#68635D" class="" text-anchor="start" font-weight="400">只授权选定项目的同步</text><path d="M62,487 L62,561" fill="none" stroke="#D7D0C6" stroke-width="2"/><circle cx="62" cy="461" r="22" fill="#FFFFFF" stroke="#D7D0C6" stroke-width="2"/><text x="62" y="472" font-size="32" fill="#244AC7" class="number" text-anchor="middle" font-weight="400">3</text><text x="105" y="472" font-size="32" fill="#282623" class="" text-anchor="start" font-weight="400">核对并注册 Hook</text><text x="105" y="518" font-size="30" fill="#68635D" class="" text-anchor="start" font-weight="400">使用本插件的 Hook 模板</text><path d="M62,609 L62,683" fill="none" stroke="#D7D0C6" stroke-width="2"/><circle cx="62" cy="583" r="22" fill="#FFFFFF" stroke="#D7D0C6" stroke-width="2"/><text x="62" y="594" font-size="32" fill="#244AC7" class="number" text-anchor="middle" font-weight="400">4</text><text x="105" y="594" font-size="32" fill="#282623" class="" text-anchor="start" font-weight="400">逐项审阅并信任 Hook</text><text x="105" y="640" font-size="30" fill="#68635D" class="" text-anchor="start" font-weight="400">重新加载会话</text><circle cx="62" cy="705" r="22" fill="#FFFFFF" stroke="#D7D0C6" stroke-width="2"/><text x="62" y="716" font-size="32" fill="#244AC7" class="number" text-anchor="middle" font-weight="400">5</text><text x="105" y="716" font-size="32" fill="#282623" class="" text-anchor="start" font-weight="400">绑定测试卡与会话</text><text x="105" y="762" font-size="30" fill="#68635D" class="" text-anchor="start" font-weight="400">发送两轮消息，再中断一次</text><rect x="40" y="820" width="560" height="147" rx="12" fill="#F5F6FB" stroke="#D7D0C6" stroke-width="2"/><text x="70" y="870" font-size="34" fill="#244AC7" class="" text-anchor="start" font-weight="500">以报告实际写入成功为准</text><text x="70" y="925" font-size="30" fill="#282623" class="" text-anchor="start" font-weight="400">安装完成后，仍需配置自动同步</text>
