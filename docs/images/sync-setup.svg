<title id="title">看板安装与自动同步配置总览</title><desc id="desc">安装插件并打开看板登记项目后，需单独批准项目范围，核对并注册Hook，再逐项审阅与信任。重新加载会话，绑定测试卡与会话，发送两轮消息并做一次中断，以报告实际写入成功为准。</desc>
