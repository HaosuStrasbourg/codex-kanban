<rect width="640" height="848" rx="20" fill="#FAF8F4"/>
<text x="40" y="54" font-size="27" fill="#68635D" class="number" text-anchor="start" font-weight="400">02</text><text x="40" y="112" font-size="42" fill="#282623" class="title" text-anchor="start" font-weight="600">项目、卡片、会话</text><text x="40" y="159" font-size="30" fill="#68635D" class="" text-anchor="start" font-weight="400">关系示意 · 一张卡片可暂不绑定</text><rect x="40" y="199" width="560" height="363" rx="14" fill="#FAF8F4" stroke="#D7D0C6" stroke-width="2"/><path d="M69 251 V223 H113 L125 235 H156 V261 H69" fill="none" stroke="#282623" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="248" font-size="32" fill="#282623" class="" text-anchor="start" font-weight="400">一个项目，多张卡片</text><rect x="92" y="285" width="456" height="86" rx="14" fill="#FFFFFF" stroke="#D7D0C6" stroke-width="2"/><text x="320" y="340" font-size="34" fill="#282623" class="" text-anchor="middle" font-weight="400">卡片：记录一项交付</text><path d="M320,371 L320,401" fill="none" stroke="#68635D" stroke-width="2"/><path d="M188,401 L452,401" fill="none" stroke="#68635D" stroke-width="2"/><path d="M188,401 L188,431" fill="none" stroke="#68635D" stroke-width="2"/><path d="M452,401 L452,431" fill="none" stroke="#68635D" stroke-width="2"/><circle cx="320" cy="401" r="4" fill="#68635D"/><rect x="66" y="431" width="244" height="104" rx="14" fill="#FFFFFF" stroke="#D7D0C6" stroke-width="2"/><text x="188" y="475" font-size="32" fill="#282623" class="" text-anchor="middle" font-weight="400">主会话</text><text x="188" y="513" font-size="30" fill="#68635D" class="" text-anchor="middle" font-weight="400">最多一条</text><rect x="330" y="431" width="244" height="104" rx="14" fill="#FFFFFF" stroke="#D7D0C6" stroke-width="2"/><text x="452" y="475" font-size="32" fill="#282623" class="" text-anchor="middle" font-weight="400">协作会话</text><text x="452" y="513" font-size="30" fill="#68635D" class="" text-anchor="middle" font-weight="400">可绑定多条</text><text x="40" y="613" font-size="32" fill="#282623" class="" text-anchor="start" font-weight="400">已绑定会话报告进展与下一步</text><text x="40" y="658" font-size="30" fill="#68635D" class="" text-anchor="start" font-weight="400">需先接通自动同步</text><path d="M40,689 L600,689" fill="none" stroke="#D7D0C6" stroke-width="2"/><text x="40" y="742" font-size="32" fill="#282623" class="" text-anchor="start" font-weight="400">AI 报告完成</text><text x="302" y="742" font-size="32" fill="#68635D" class="" text-anchor="start" font-weight="400">→</text><text x="365" y="742" font-size="34" fill="#244AC7" class="" text-anchor="start" font-weight="500">待验收</text><text x="40" y="805" font-size="32" fill="#282623" class="" text-anchor="start" font-weight="400">侧栏人工确认</text><text x="302" y="805" font-size="32" fill="#68635D" class="" text-anchor="start" font-weight="400">→</text><text x="365" y="805" font-size="34" fill="#282623" class="" text-anchor="start" font-weight="500">已完成</text>
