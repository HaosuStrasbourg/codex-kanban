<svg xmlns="http://www.w3.org/2000/svg" width="640" height="848" viewBox="0 0 640 848" role="img" aria-labelledby="title desc">
<title id="title">项目、卡片和会话的关系</title><desc id="desc">项目下有多张卡片。卡片可暂不绑定会话；主会话最多一条，协作会话可多条。已绑定会话在自动同步接通后报告进展与下一步。AI报告完成转为待验收，最终完成由用户在侧栏确认。</desc>
<metadata>Original explanatory diagram, MIT. Synthetic examples only. No application screenshot or acceptance evidence. Rendered PNG accompanies editable SVG. Local fonts are referenced, not redistributed.</metadata>
